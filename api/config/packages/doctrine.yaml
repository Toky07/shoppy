doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Product:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Product/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Product\Infrastructure\Persistence\Doctrine\Entity'
                alias: Product
            User:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\User\Infrastructure\Persistence\Doctrine\Entity'
                alias: User
            Auth:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Auth\Infrastructure\Persistence\Doctrine\Entity'
                alias: Auth
            Order:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Order/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Order\Infrastructure\Persistence\Doctrine\Entity'
                alias: Order
            Cart:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cart/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Cart\Infrastructure\Persistence\Doctrine\Entity'
                alias: Cart
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payment/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Payment\Infrastructure\Persistence\Doctrine\Entity'
                alias: Payment
            Media:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Media/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Media\Infrastructure\Persistence\Doctrine\Entity'
                alias: Media
        controller_resolver:
            auto_mapping: false

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
