# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.media.upload_dir: '%kernel.project_dir%/public/uploads'
    env(MAILER_DSN): 'null://null'
    env(MAILER_FROM): 'noreply@shoppy.test'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Payment\Application\PaymentGateway:
            tags: ['payment.gateway']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'
            - '../src/*/Application/Command/'
            - '../src/*/Application/Query/'
            - '../src/*/Application/Response/'
            - '../src/*/Application/Event/'
            - '../src/*/Application/Csv/ProductCsvRow.php'
            - '../src/*/Application/Port/'
            - '../src/*/Application/Image/GeneratedProductImage.php'
            - '../src/*/Application/Image/ProductImageLoader.php'
            - '../src/*/Application/Image/HttpDownloader.php'
            - '../src/*/Presentation/Request/'
            - '../src/*/Presentation/Exception/'
            - '../src/*/Presentation/Http/ErrorResponse.php'
            - '../src/*/Presentation/Http/ErrorViolation.php'
            - '../src/*/Presentation/Http/MappedHttpError.php'
            - '../src/*/Infrastructure/Persistence/Doctrine/Entity/'
            - '../src/Payment/Infrastructure/Gateway/StripePaymentGateway.php'
            - '../src/Payment/Infrastructure/Gateway/Stripe/'

    App\Product\Domain\Repository\ProductRepository: '@App\Product\Infrastructure\Persistence\Doctrine\DoctrineProductRepository'

    App\Media\Domain\Repository\MediaRepository: '@App\Media\Infrastructure\Persistence\Doctrine\DoctrineMediaRepository'

    App\Media\Application\Port\MediaStorage: '@App\Media\Infrastructure\Storage\FilesystemMediaStorage'

    App\User\Domain\Repository\UserRepository: '@App\User\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'

    App\Auth\Domain\Repository\CredentialsRepository: '@App\Auth\Infrastructure\Persistence\Doctrine\DoctrineCredentialsRepository'

    App\Auth\Domain\Repository\AccessTokenRepository: '@App\Auth\Infrastructure\Persistence\Doctrine\DoctrineAccessTokenRepository'

    App\Auth\Application\PasswordHasher: '@App\Auth\Infrastructure\Security\NativePasswordHasher'

    App\Auth\Application\TokenGenerator: '@App\Auth\Infrastructure\Security\RandomTokenGenerator'

    App\Shared\Domain\Clock: '@App\Shared\Infrastructure\SystemClock'

    App\Shared\Domain\Event\EventBus:
        alias: App\Shared\Infrastructure\Event\SymfonyEventBus
        public: true

    App\Email\Infrastructure\Mailer\SymfonyMailer:
        arguments:
            $fromAddress: '%env(MAILER_FROM)%'

    App\Email\Application\Port\Mailer: '@App\Email\Infrastructure\Mailer\SymfonyMailer'

    App\Order\Application\Port\CustomerContact: '@App\Order\Infrastructure\Customer\UserCustomerContact'

    App\Payment\Application\Port\PayerContact: '@App\Payment\Infrastructure\Customer\UserPayerContact'

    App\Order\Domain\Repository\OrderRepository: '@App\Order\Infrastructure\Persistence\Doctrine\DoctrineOrderRepository'

    App\Order\Application\Catalog: '@App\Order\Infrastructure\Catalog\ProductCatalog'

    App\Cart\Domain\Repository\CartRepository: '@App\Cart\Infrastructure\Persistence\Doctrine\DoctrineCartRepository'

    App\Cart\Application\Catalog: '@App\Cart\Infrastructure\Catalog\ProductCatalog'

    App\Payment\Domain\Repository\PaymentRepository: '@App\Payment\Infrastructure\Persistence\Doctrine\DoctrinePaymentRepository'

    App\Payment\Application\PaymentGateway: '@App\Payment\Infrastructure\Gateway\LocalPaymentGateway'

    App\Payment\Infrastructure\Gateway\Stripe\StripeSdkCheckoutClient:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Payment\Infrastructure\Gateway\Stripe\StripeCheckoutClient: '@App\Payment\Infrastructure\Gateway\Stripe\StripeSdkCheckoutClient'

    App\Payment\Infrastructure\Gateway\StripePaymentGateway:
        arguments:
            $currency: 'eur'
        tags: ['payment.gateway']

    App\Payment\Infrastructure\Gateway\Stripe\StripeSdkWebhookParser:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    App\Payment\Application\StripeWebhookParser: '@App\Payment\Infrastructure\Gateway\Stripe\StripeSdkWebhookParser'

    App\Payment\Application\PaymentGatewayRegistry:
        arguments:
            $gateways: !tagged_iterator payment.gateway
            $defaultProvider: '%env(PAYMENT_PROVIDER)%'

    App\Product\Application\Csv\ProductCsvReader: '@App\Product\Infrastructure\Csv\FileProductCsvReader'

    App\Product\Application\Image\ProductImageLoader: '@App\Product\Infrastructure\Image\CachedProductImageLoader'

    App\Product\Application\Image\HttpDownloader: '@App\Product\Infrastructure\Image\StreamHttpDownloader'

    App\Product\Application\Image\ProductImageWriter: '@App\Product\Infrastructure\Image\SvgProductImageWriter'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
