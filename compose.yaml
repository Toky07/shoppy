name: shoppy

services:
  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite:////app/var/data.db
      DEFAULT_URI: http://localhost:${API_PORT:-8000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-local}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_var:/app/var
      - api_uploads:/app/public/uploads
      - composer_cache:/tmp/composer
    ports:
      - "${API_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/products') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 12

  front:
    build:
      context: ./front
      dockerfile: docker/Dockerfile
      network: host
    restart: unless-stopped
    init: true
    environment:
      API_PROXY_TARGET: http://api:80
      VITE_API_URL: /api
      VITE_IN_DOCKER: "1"
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_CLIENT_PORT: ${VITE_PORT:-5173}
      VITE_PORT: ${VITE_PORT:-5173}
      npm_config_cache: /root/.npm
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  api_vendor:
  api_var:
  api_uploads:
  composer_cache:
  front_node_modules:
  npm_cache:
