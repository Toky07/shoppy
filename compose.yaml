name: shoppy

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-database-url: &database-url postgresql://${POSTGRES_USER:-shoppy}:${POSTGRES_PASSWORD:-shoppy}@database:5432/${POSTGRES_DB:-shoppy}?serverVersion=16&charset=utf8

services:
  database:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoppy}
      POSTGRES_USER: ${POSTGRES_USER:-shoppy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  pgadmin:
    <<: *hardening
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-shoppy}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_LISTEN_PORT: "8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"
    depends_on:
      database:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ./api
      dockerfile: docker/Dockerfile
      target: development
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: dev
      DATABASE_URL: *database-url
      DEFAULT_URI: http://localhost:${API_PORT:-8000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-noreply@shoppy.test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_var:/app/var
      - api_uploads:/app/public/uploads
      - composer_cache:/tmp/composer
    ports:
      - "127.0.0.1:${API_PORT:-8000}:80"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/products') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 12

  front:
    <<: *hardening
    build:
      context: ./front
      dockerfile: docker/Dockerfile
      target: development
      network: host
    restart: unless-stopped
    init: true
    environment:
      API_PROXY_TARGET: http://api:80
      VITE_API_URL: /api
      VITE_IN_DOCKER: "1"
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_CLIENT_PORT: ${VITE_PORT:-5173}
      VITE_PORT: ${VITE_PORT:-5173}
      npm_config_cache: /root/.npm
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  postgres_data:
  pgadmin_data:
  api_vendor:
  api_var:
  api_uploads:
  composer_cache:
  front_node_modules:
  npm_cache:
