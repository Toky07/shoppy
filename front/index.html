<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shoppy — une sélection d'objets utiles, livrés vite et payés en toute sécurité.">
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
    <title>Shoppy — Boutique</title>
    <script>
      // Applique le thème avant le premier paint pour éviter le flash blanc.
      try {
        const stored = localStorage.getItem('shoppy.theme')
        const dark =
          stored === 'dark' ||
          ((stored === null || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
