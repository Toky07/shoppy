name: shoppy-prod

services:
  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: sqlite:////app/var/data.db
      DEFAULT_URI: ${DEFAULT_URI:-https://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://localhost}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-https://localhost}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-noreply@shoppy.test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto,x-forwarded-port,x-forwarded-host
    volumes:
      - api_uploads:/app/public/uploads
      - api_var:/app/var
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/products') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 8

  front:
    build:
      context: ./front
      dockerfile: docker/Dockerfile
      target: production
      network: host
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_uploads:
  api_var:
